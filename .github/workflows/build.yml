name: 앱 만들기

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 서명 키 준비 (GitHub Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::서명 키 비밀값(KEYSTORE_B64, KEYSTORE_PASSWORD)이 없어요. README의 '서명 키 설정'을 먼저 해 주세요."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/rider.keystore

      - name: APK 빌드
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/debug/app-debug.apk RiderLog-${{ github.run_number }}.apk

      - name: 다운로드 페이지(Releases)에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 배달 기록 앱 v1.0.${{ github.run_number }}
          body: 폰에서 아래 RiderLog-${{ github.run_number }}.apk 를 눌러 받아 설치하세요.
          files: RiderLog-${{ github.run_number }}.apk
